[project]
name = "continuous-testing-quality-gates"
version = "1.1.0"
description = "Continuous testing demo with layered pytest suites and CI quality gates."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "pytest-cov>=5.0,<7.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: isolated unit tests",
  "integration: in-process API integration tests",
  "contract: API response contract tests",
  "regression: tests protecting previously fixed API behavior"
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
